---
- name: "Manage AWS Infrastructure | Create IAM Role"
  amazon.aws.iam_role:
    name: "{{ aws_iam_role_name }}"
    description: "{{ aws_iam_role_description }}"
    assume_role_policy_document: "{{ lookup('ansible.builtin.template', 'ec2-trust-policy.json.j2') }}"
    state: present
  register: aws_iam_role_info

- name: "Manage AWS Infrastructure | Attach S3 Policy"
  amazon.aws.iam_policy:
    policy_name: "EC2-S3-ReadWrite-Policy"
    state: present
    policy_json: "{{ lookup('ansible.builtin.template', 's3-policy.json.j2') }}"
    iam_type: role
    iam_name: "{{ aws_iam_role_name }}"

- name: "Manage AWS Infrastructure | Create IAM Instance Profile"
  amazon.aws.iam_instance_profile:
    name: "{{ aws_iam_profile_name }}"
    roles:
      - "{{ aws_iam_role_name }}"
    state: present
  register: iam_profile_info
