---
- name: "Manage AWS Infrastructure | Start an EC2 Instance"
  amazon.aws.ec2_instance:
    name: "{{ aws_ec2_name | default('web-stack-ansible-instance') }}"
    key_name: "{{ aws_ec2_key_name }}"
    iam_instance_profile: "{{ aws_iam_profile_name }}"
    security_group: "{{ aws_sg_name }}"
    image_id: "{{ latest_ubuntu_ami_id }}"
    vpc_subnet_id: "{{ aws_subnet.subnet.id }]"
    instance_type: "{{ aws_ec2_instance_type }}"
    volumes: "{{ aws_ec2_instance_volumes }}"
    count: "{{ aws_ec2_instance_count | default('1') }}"
    wait: "{{ aws_ec2_instance_wait }}"
    wait_timeout: "{{ aws_ec2_instance_wait_timeout }}"
    network:
      assign_public_ip: "{{ aws_ec2_instance_public_ip | default('yes') }}"
    state: present
  register: aws_ec2_info

- name: "Manage AWS Infrastructure | Add EC2 Instance In-Memory Inv Group"
  ansible.builtin.add_host:
    name: "{{ aws_ec2_info.instances[0].public_ip_address }}"
    groups: launched_ec2_nodes
    ansible_user: ubuntu
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
