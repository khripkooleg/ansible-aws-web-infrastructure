---
- name: "Manage AWS Infrastructure | Search For An Instance"
  amazon.aws.ec2_ami_info:
    owners: ["099720109477"]
    filters:
      name: "ubuntu/images/hvm-ssd/ubuntu-jammy-22.04-amd64-server-*"
      architecture: "x86_64"
      root-device-type: "ebs"
      virtualization-type: "hvm"
  register: ubuntu_ami

- name: "Manage AWS Infrastructure | Save the latest AMI ID"
  ansible.builtin.set_fact:
    latest_ubuntu_ami_id: "{{ ubuntu_ami.images | sort(attribute='creation_date') | last).image_id }}"
