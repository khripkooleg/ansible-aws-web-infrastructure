---
- name: "Install Prometheus"
  ansible.builtin.package:
    name:
      - prometheus
      - prometheus-node-exporter
    state: present
    update_cache: yes

- name: "Install Grafana | Prerequisite packages"
  ansible.builtin.package:
    name:
      - apt-transport-https
      - wget
      - gnupg
    state: present
    update_cache: yes

- name: "Install Grafana | Import GPG key"
  ansible.builtin.shell: |
    mkdir -p /etc/apt/keyrings
    wget -O /etc/apt/keyrings/grafana.asc https://apt.grafana.com/gpg-full.key
    chmod 644 /etc/apt/keyrings/grafana.asc

    echo "deb [signed-by=/etc/apt/keyrings/grafana.asc] https://apt.grafana.com stable main" | sudo tee -a /etc/apt/sources.list.d/grafana.list

    exit 0
  args:
    executable: /bin/bash

- name: "Install Grafana | Update repositories"
  ansible.builtin.apt:
    update_cache: yes
    upgrade: yes

- name: "Install Grafana | Install Grafana OSS"
  ansible.builtin.package:
    name: grafana
    state: present
    update_cache: yes
